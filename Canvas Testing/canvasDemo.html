<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintCanvas — interactive region painter</title>
    <link rel="stylesheet" href="./dependencies/style.css">
    <script src="./dependencies/CanvasPaint.js" defer></script>
</head>
    <body>
    <div class="wrap">
        <div class="panel">
        <div>
            <h1>PaintCanvas demo</h1>
            <p class="sub">Freehand region painter — the reusable module.</p>
        </div>

        <div class="field">
            <label>Amount of regions</label>
            <input type="number" id="regionCount" min="1" value="3">
        </div>

        <div class="field">
            <label>Region</label>
            <select id="regionSelect"></select>
        </div>

        <div class="row">
            <div class="field">
            <label>Brush size (px)</label>
            <input type="number" id="brushSize" min="1" value="20" style="width:90px">
            </div>
            <div class="field">
            <label>Mode</label>
            <select id="paintMode">
                <option value="paint">Paint</option>
                <option value="erase">Erase</option>
            </select>
            </div>
        </div>

        <div class="row">
            <button id="clearRegion">Clear region</button>
            <button id="clearAll">Clear all</button>
        </div>

        <div class="row">
            <button id="tintToggle">Toggle brightness view</button>
            <button class="primary" id="exportBtn">Export masks (JSON)</button>
        </div>

        <div id="log"></div>
        </div>

        <div class="stage">
        <div style="font-weight:600">Canvas <span style="color:var(--mut);font-weight:400">(480×640, shown at half size)</span></div>
        <canvas id="paint" width="480" height="640" style="width:240px; height:320px;"></canvas>
        </div>
    </div>

    </body>
    </html>
